<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Video</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #000; }
    body {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      align-content: start;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 84px 24px 24px;
    }
    .app-header {
      position: fixed;
      z-index: 5;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 24px;
      background: rgba(0, 0, 0, .94);
      border-bottom: 1px solid #333;
      color: #fff;
    }
    .home-link {
      color: #fff;
      font: 600 .9rem -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-decoration: none;
    }
    .home-link:hover { color: #ccc; }
    .home-link:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    .app-header h1 {
      font: 600 1rem -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .video-link {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #111;
    }
    .video-link img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .play-button {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 72px;
      height: 50px;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      border-radius: 14px;
      background: #f00;
      color: white;
      font-size: 26px;
      line-height: 1;
      transition: background .2s, transform .2s;
    }
    .video-link:hover .play-button {
      background: #c00;
      transform: translate(-50%, -50%) scale(1.08);
    }
  </style>
</head>
<body>
  <header class="app-header">
    <a class="home-link" href="index.html" aria-label="Volver al inicio">← Volver</a>
    <h1>Videos</h1>
  </header>
  <a class="video-link" href="https://www.youtube.com/watch?v=ciuRSwnUGU8" target="_blank" rel="noopener noreferrer" aria-label="Ver el primer video en YouTube">
    <img src="https://img.youtube.com/vi/ciuRSwnUGU8/hqdefault.jpg" alt="Miniatura del primer video">
    <span class="play-button" aria-hidden="true">▶</span>
  </a>
  <a class="video-link" href="https://www.youtube.com/watch?v=sOMazm39VQI" target="_blank" rel="noopener noreferrer" aria-label="Ver el segundo video en YouTube">
    <img src="https://img.youtube.com/vi/sOMazm39VQI/hqdefault.jpg" alt="Miniatura del segundo video">
    <span class="play-button" aria-hidden="true">▶</span>
  </a>
</body>
</html>
